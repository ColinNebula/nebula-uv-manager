name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python syntax
        run: python -m compileall -q .

      - name: Check extension manifest metadata
        run: |
          python - << 'PY'
          from pathlib import Path
          import tomllib

          manifest = Path('blender_manifest.toml')
          if not manifest.exists():
              raise SystemExit('Missing blender_manifest.toml')

          data = tomllib.loads(manifest.read_text(encoding='utf-8'))
          required = ['id', 'version', 'name', 'blender_version_min', 'license', 'maintainer']
          missing = [k for k in required if k not in data or not data[k]]
          if missing:
              raise SystemExit(f'Missing required manifest fields: {", ".join(missing)}')

          perms = data.get('permissions', {})
          if not isinstance(perms, dict):
              raise SystemExit('permissions must be a TOML table')

          print('Manifest looks valid for release metadata checks.')
          PY

      - name: Prevent accidental large files in Git history
        run: |
          python - << 'PY'
          import subprocess
          import sys

          limit_bytes = 20 * 1024 * 1024
          out = subprocess.check_output(['git', 'ls-files', '-z'])
          files = [p for p in out.decode('utf-8', errors='ignore').split('\0') if p]
          too_large = []
          for path in files:
              size = int(subprocess.check_output(['git', 'cat-file', '-s', f'HEAD:{path}']).decode().strip())
              if size > limit_bytes:
                  too_large.append((path, size))

          if too_large:
              for path, size in too_large:
                  print(f'Large tracked file: {path} ({size} bytes)')
              sys.exit(1)

          print('No oversized tracked files found.')
          PY
